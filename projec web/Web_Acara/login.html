<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXORA Login</title><link rel="stylesheet" href="style.css"></head><body><main class="section" style="min-height:100vh;display:grid;place-items:center"><form class="panel" id="login" style="max-width:460px;width:100%"><div class="brand"><span class="brand-mark">N</span><span>NEXORA</span></div><h2 style="font-family:Space Grotesk;margin:30px 0 10px">Welcome <span>back.</span></h2><p class="muted">Demo login lokal — tanpa XAMPP.</p><label style="margin-top:25px">Email<input required type="email" name="email" placeholder="you@email.com"></label><label style="margin-top:15px">Password<input required type="password" name="password" placeholder="••••••••"></label><button class="btn primary full" style="margin-top:20px">Login</button><a class="btn ghost full" style="margin-top:10px" href="index.html">← Kembali ke acara</a></form></main><script>document.querySelector("#login").onsubmit=e=>{e.preventDefault();localStorage.setItem("nexora_user",JSON.stringify({email:new FormData(e.target).get("email"),role:"user"}));alert("Login demo berhasil!");location.href="index.html"}</script></body></html>
